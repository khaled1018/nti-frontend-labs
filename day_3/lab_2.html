<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 2</title>
  </head>
  <body
    style="display: flex; gap: 2em; flex-direction: column; align-items: center"
  >
    <!-- Second PDF -->
    <div style="margin: auto" id="dateTime">Current date and time:</div>
    <div>
      <button
        id="btn_showDateAndTime"
        style="
          color: white;
          background-color: rgb(255, 0, 0);
          width: 15em;
          height: 4em;
          cursor: pointer;
          border: 0;
          border-radius: 16px;
          margin: auto;
        "
      >
        Show Date and Time
      </button>
    </div>
    <div>
      <button
        id="btn_openWindow"
        style="
          color: white;
          background-color: rgb(0, 0, 0);
          width: 15em;
          height: 4em;
          cursor: pointer;
          border: 0;
          border-radius: 16px;
        "
      >
        Open new window
      </button>
    </div>
    <div id="userInfo"></div>
    <script src="lab_2.js"></script>
